services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env.production
    ports:
      - "127.0.0.1:3003:3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
